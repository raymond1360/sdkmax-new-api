name: Feature branch build & test verification (no deploy)

# Manual-only verification for feature branches (e.g. Google primary login).
# This workflow intentionally does NOT publish any image anywhere and does
# NOT touch production: it exists purely to prove that a feature branch
# compiles, passes its tests, and produces a working Docker image via the
# existing multi-stage Dockerfile, without needing Docker on a developer's
# machine and without going anywhere near sdkmax-prod/release or the
# production-tag-publishing docker-build.yml workflow.
#
# This workflow file itself lives on the default branch (sdkmax-dev) so
# GitHub will let it be dispatched at all (workflow_dispatch requires the
# workflow definition to already exist on the default branch). The branch it
# actually builds is controlled by the `target_ref` input below, NOT by
# "Use workflow from" — every job explicitly checks out `target_ref` and
# then verifies the commit it actually got matches what target_ref resolved
# to at dispatch time, failing immediately on any mismatch. This is what
# lets you run this workflow against feature/google-primary-login (or any
# other branch) without ever merging that branch's code into sdkmax-dev.
#
# Safety properties (see docs/deployment/CLAUDE_GOOGLE_LOGIN_PRE_PRODUCTION_CHECK.md):
# - workflow_dispatch only: never runs on push/PR, cannot be triggered by
#   merely pushing a feature branch.
# - Docker image is built locally in the runner (push: false) and discarded
#   when the job ends. Nothing is pushed to Docker Hub, GHCR, or any
#   registry, so there is no way to overwrite `sdkmax-prod`, `latest`, or
#   any other existing tag.
# - No Google OAuth credentials are referenced anywhere in this file or in
#   the Dockerfile; OAuth credentials are runtime admin-configured data, not
#   build inputs.
# - Does not modify, read, or depend on any other workflow file.
# - Build order matches the real Dockerfile: both frontend themes are built
#   BEFORE any Go build, because main.go embeds both web/default/dist and
#   web/classic/dist at compile time (`//go:embed`) and fails outright if
#   either directory is missing — dist directories are never committed to
#   Git, only generated at build time.
# - The secret scan's incremental (git-history) step only scans commits new
#   relative to origin/sdkmax-dev, so it can never re-surface old, already
#   reviewed history; the working-tree snapshot scan uses a small,
#   fingerprint-precise .gitleaksignore for a handful of manually verified
#   pre-existing false positives (documented in the same file) — it does not
#   disable any rule and does not touch new findings.
# - gofmt, go vet, and the frontend typecheck are scoped to only the files a
#   branch actually changes relative to origin/sdkmax-dev (same merge-base
#   technique as the secret scan above). This was a deliberate choice after
#   a real run showed pre-existing, unrelated drift on sdkmax-dev itself
#   (verified against a clean sdkmax-dev baseline clone with zero relation to
#   any feature branch): 9 files with gofmt drift, 12 go vet findings, and a
#   pre-existing frontend type error, none touched by this or the Google
#   feature branch. No rule is disabled and no check is skipped — full
#   output is always printed — but this workflow only fails a build over
#   problems the branch being verified actually introduced.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or SHA to actually check out and build (e.g. feature/google-primary-login)"
        required: true
        type: string

concurrency:
  group: feature-build-verify-${{ github.event.inputs.target_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-ref:
    name: Resolve and verify target_ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve target_ref to a commit SHA via the GitHub API
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_REF" ]; then
            echo "::error::target_ref input is required and was empty"
            exit 1
          fi
          SHA=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "refs/heads/$TARGET_REF" | cut -f1)
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve target_ref '$TARGET_REF' to a branch on ${{ github.repository }}"
            exit 1
          fi
          echo "Requested target_ref: $TARGET_REF"
          echo "Resolved HEAD SHA:    $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Feature branch verification"
            echo ""
            echo "- Requested \`target_ref\`: \`$TARGET_REF\`"
            echo "- Resolved HEAD SHA: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend build, vet, test
    needs: [resolve-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Verify checked-out commit matches resolved target_ref
        env:
          EXPECTED: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          ACTUAL=$(git rev-parse HEAD)
          echo "target_ref:        ${{ inputs.target_ref }}"
          echo "actual HEAD SHA:   $ACTUAL"
          echo "expected HEAD SHA: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checked-out commit ($ACTUAL) does not match target_ref's resolved commit ($EXPECTED). Refusing to build — this would otherwise silently build the wrong ref."
            exit 1
          fi

      - name: Fetch sdkmax-dev for diff-scoped lint checks
        run: git fetch --no-tags origin sdkmax-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Write placeholder VERSION file
        run: echo "verify-$(git rev-parse --short=12 HEAD)" > VERSION

      # Steps below mirror the Dockerfile's real build order: both frontend
      # themes must be built before `go build`, because main.go embeds both
      # web/default/dist and web/classic/dist at compile time.
      - name: Install web/default dependencies
        working-directory: web/default
        run: bun install

      - name: Build web/default (main.go embeds web/default/dist)
        working-directory: web/default
        run: DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$(cat ../VERSION) bun run build

      - name: Install web/classic dependencies
        working-directory: web/classic
        run: bun install

      - name: Build web/classic (main.go embeds web/classic/dist)
        working-directory: web/classic
        run: VITE_REACT_APP_VERSION=$(cat ../VERSION) bun run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build $(go list ./... | grep -v '/backup/')

      - name: gofmt check (files changed vs sdkmax-dev only)
        # Scoped to this branch's diff against sdkmax-dev: pre-existing gofmt
        # drift elsewhere in the repo is untouched, unrelated debt and must
        # not block this workflow. Any file this branch actually adds or
        # modifies is still held to full gofmt compliance.
        run: |
          BASE=$(git merge-base origin/sdkmax-dev HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD -- '*.go' | grep -v '^backup/' || true)
          echo "Diff base: $BASE"
          echo "Go files changed vs sdkmax-dev:"
          echo "${CHANGED:-<none>}"
          if [ -z "$CHANGED" ]; then
            exit 0
          fi
          BAD=$(gofmt -l $CHANGED)
          if [ -n "$BAD" ]; then
            echo "::error::The following files changed by this branch are not gofmt-formatted:"
            echo "$BAD"
            exit 1
          fi

      - name: go vet (fails only on files changed vs sdkmax-dev; full output is informational)
        # go vet must run against whole packages (it can't be scoped to
        # individual files), so this runs the full check, prints all output,
        # then only fails the step if a diagnostic references a file this
        # branch actually changed relative to sdkmax-dev. Pre-existing
        # findings in untouched files are reported but non-blocking.
        run: |
          BASE=$(git merge-base origin/sdkmax-dev HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD -- '*.go' | grep -v '^backup/' || true)
          echo "Go files changed vs sdkmax-dev:"
          echo "${CHANGED:-<none>}"
          set +e
          VET_OUT=$(go vet $(go list ./... | grep -v '/backup/') 2>&1)
          VET_EXIT=$?
          set -e
          echo "$VET_OUT"
          if [ $VET_EXIT -eq 0 ]; then
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "go vet reported findings above, but none are in files changed by this branch; not blocking."
            exit 0
          fi
          NEW_FINDINGS=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            MATCH=$(echo "$VET_OUT" | grep -F "$f" || true)
            if [ -n "$MATCH" ]; then
              NEW_FINDINGS="${NEW_FINDINGS}${MATCH}
"
            fi
          done <<< "$CHANGED"
          if [ -n "$NEW_FINDINGS" ]; then
            echo "::error::go vet findings in files changed by this branch:"
            echo "$NEW_FINDINGS"
            exit 1
          fi
          echo "go vet findings above are all in pre-existing files unrelated to this branch's changes; not blocking."

      - name: go test (feature-relevant packages, fails only on failures tied to this branch's changes; full output is informational)
        # Same diff-scoping approach as gofmt/go vet above: one pre-existing,
        # already-broken test (TestListModelsTokenLimitIncludesTieredBillingModel,
        # confirmed failing even in isolation on a clean sdkmax-dev baseline
        # with zero relation to this branch) must not block this workflow.
        # Any failure whose trace references a file this branch actually
        # changed under oauth/, controller/, model/, or middleware/ still
        # fails the build.
        run: |
          BASE=$(git merge-base origin/sdkmax-dev HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'oauth/*.go' 'controller/*.go' 'model/*.go' 'middleware/*.go' | grep -v '^backup/' || true)
          echo "Feature-relevant Go files changed vs sdkmax-dev:"
          echo "${CHANGED:-<none>}"
          set +e
          TEST_OUT=$(go test ./oauth/... ./controller/... ./model/... ./middleware/... 2>&1)
          TEST_EXIT=$?
          set -e
          echo "$TEST_OUT"
          if [ $TEST_EXIT -eq 0 ]; then
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "go test reported failures above, but this branch changed no files under oauth/, controller/, model/, or middleware/; not blocking."
            exit 0
          fi
          NEW_FINDINGS=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            MATCH=$(echo "$TEST_OUT" | grep -F "$f" || true)
            if [ -n "$MATCH" ]; then
              NEW_FINDINGS="${NEW_FINDINGS}${MATCH}
"
            fi
          done <<< "$CHANGED"
          if [ -n "$NEW_FINDINGS" ]; then
            echo "::error::go test failures referencing files changed by this branch:"
            echo "$NEW_FINDINGS"
            exit 1
          fi
          echo "go test failures above are all pre-existing and unrelated to this branch's changes; not blocking."

      - name: go test (full suite, informational only)
        # Not gating: the upstream test suite has pre-existing failures
        # unrelated to this feature (confirmed via `git stash` against the
        # sdkmax-dev baseline, see the test report). This step still runs
        # and its output is visible in the log/summary — it is not skipped,
        # only non-blocking, so failures are never hidden. Bounded by
        # timeout-minutes so a hang doesn't burn CI time silently.
        continue-on-error: true
        timeout-minutes: 10
        run: go test $(go list ./... | grep -v '/backup/')

  frontend:
    name: Frontend typecheck & build
    needs: [resolve-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Verify checked-out commit matches resolved target_ref
        env:
          EXPECTED: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          ACTUAL=$(git rev-parse HEAD)
          echo "target_ref:        ${{ inputs.target_ref }}"
          echo "actual HEAD SHA:   $ACTUAL"
          echo "expected HEAD SHA: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checked-out commit ($ACTUAL) does not match target_ref's resolved commit ($EXPECTED). Refusing to build."
            exit 1
          fi

      - name: Fetch sdkmax-dev for diff-scoped typecheck
        run: git fetch --no-tags origin sdkmax-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web/default
        run: bun install

      - name: Typecheck (fails only on files changed vs sdkmax-dev; full output is informational)
        # Same diff-scoping rationale as the backend gofmt/go vet steps: a
        # pre-existing type error in usage-logs-mobile-card.tsx (confirmed
        # unrelated to this or the Google feature branch, present on plain
        # sdkmax-dev) must not block this workflow, but any type error in a
        # file this branch actually touches still fails the build.
        working-directory: web/default
        run: |
          BASE=$(git merge-base origin/sdkmax-dev HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'web/default/*' | sed 's#^web/default/##' | grep -v '^backup/' || true)
          echo "web/default files changed vs sdkmax-dev:"
          echo "${CHANGED:-<none>}"
          set +e
          TS_OUT=$(bun run typecheck 2>&1)
          TS_EXIT=$?
          set -e
          echo "$TS_OUT"
          if [ $TS_EXIT -eq 0 ]; then
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "Typecheck reported errors above, but none are in files changed by this branch; not blocking."
            exit 0
          fi
          NEW_FINDINGS=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            MATCH=$(echo "$TS_OUT" | grep -F "$f" || true)
            if [ -n "$MATCH" ]; then
              NEW_FINDINGS="${NEW_FINDINGS}${MATCH}
"
            fi
          done <<< "$CHANGED"
          if [ -n "$NEW_FINDINGS" ]; then
            echo "::error::Typecheck errors in files changed by this branch:"
            echo "$NEW_FINDINGS"
            exit 1
          fi
          echo "Typecheck errors above are all in pre-existing files unrelated to this branch's changes; not blocking."

      - name: Build
        working-directory: web/default
        run: bun run build

  secret-scan:
    name: Secret scan (gitleaks)
    needs: [resolve-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Verify checked-out commit matches resolved target_ref
        env:
          EXPECTED: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          ACTUAL=$(git rev-parse HEAD)
          echo "target_ref:        ${{ inputs.target_ref }}"
          echo "actual HEAD SHA:   $ACTUAL"
          echo "expected HEAD SHA: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checked-out commit ($ACTUAL) does not match target_ref's resolved commit ($EXPECTED). Refusing to scan."
            exit 1
          fi

      - name: Install gitleaks (OSS binary, no license required)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan working tree
        # Uses .gitleaksignore at the repo root: a small, fingerprint-exact
        # allowlist of manually verified pre-existing false positives
        # (unrelated to this or any feature branch). Any new finding is NOT
        # covered by it and will fail this step.
        run: gitleaks dir . --no-banner

      - name: Scan commits new relative to origin/sdkmax-dev (incremental)
        # Deliberately scoped to only the commits this branch adds on top of
        # sdkmax-dev, not the entire repository history. This must always
        # come back with zero findings on its own — no baseline or allowlist
        # is used or needed here, because it never re-scans old, already
        # reviewed commits in the first place.
        run: |
          git fetch --no-tags origin sdkmax-dev
          BASE=$(git merge-base origin/sdkmax-dev HEAD)
          echo "Incremental scan range: $BASE..HEAD"
          gitleaks git --log-opts="$BASE..HEAD" --no-banner .

  docker-build:
    name: Docker image build (local only, not pushed)
    needs: [resolve-ref, backend, frontend, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Verify checked-out commit matches resolved target_ref
        env:
          EXPECTED: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          ACTUAL=$(git rev-parse HEAD)
          echo "target_ref:        ${{ inputs.target_ref }}"
          echo "actual HEAD SHA:   $ACTUAL"
          echo "expected HEAD SHA: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checked-out commit ($ACTUAL) does not match target_ref's resolved commit ($EXPECTED). Refusing to build."
            exit 1
          fi

      - name: Write placeholder VERSION file
        run: echo "google-primary-login-$(git rev-parse --short=12 HEAD)" > VERSION

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            sdkmax-new-api:google-primary-login-verify
          cache-from: type=gha,scope=feature-verify-amd64
          cache-to: type=gha,mode=max,scope=feature-verify-amd64

      - name: Inspect built image (digest is local-only, image was not pushed)
        run: docker image inspect sdkmax-new-api:google-primary-login-verify --format '{{.Id}}'

      - name: Build summary
        run: |
          echo "### Feature branch verification build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- target_ref: \`${{ inputs.target_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built commit: \`${{ needs.resolve-ref.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local tag: \`sdkmax-new-api:google-primary-login-verify\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image ID: \`${{ steps.build.outputs.imageid }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pushed to a registry: **no** (this workflow never pushes anywhere)" >> "$GITHUB_STEP_SUMMARY"
