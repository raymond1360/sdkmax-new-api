name: Build SDKMAX production image

on:
  push:
    branches:
      - sdkmax-prod
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Version tag to publish, for example v1.0.1"
        required: false
        type: string

concurrency:
  group: sdkmax-docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push linux/amd64 image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tags
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          INPUT_TAG="${{ github.event.inputs.image_tag || '' }}"
          POINTING_TAG="$(git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -n 1 || true)"

          if [ -n "$INPUT_TAG" ]; then
            VERSION_TAG="$INPUT_TAG"
          elif [ -n "$POINTING_TAG" ]; then
            VERSION_TAG="$POINTING_TAG"
          else
            VERSION_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9_.-]+)?$ ]]; then
            echo "::error::Invalid image tag '$VERSION_TAG'. Expected a version such as v1.0.1."
            exit 1
          fi

          IMAGE_REPOSITORY="${{ secrets.DOCKERHUB_USERNAME }}/sdkmax-new-api"

          echo "$VERSION_TAG" > VERSION
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image_repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version_tag }}
            type=raw,value=sdkmax-prod
            type=raw,value=sha-${{ steps.version.outputs.short_sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sdkmax-prod-amd64
          cache-to: type=gha,mode=max,scope=sdkmax-prod-amd64
          provenance: false
          sbom: false

      - name: Build summary
        run: |
          echo "### SDKMAX production image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${{ steps.version.outputs.image_repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version tag: \`${{ steps.version.outputs.version_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch tag: \`sdkmax-prod\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit tag: \`sha-${{ steps.version.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
