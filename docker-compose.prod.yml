# SDKMAX production compose file.
# Runtime-only production compose file. Production servers pull a prebuilt
# SDKMAX image from Docker Hub and must not build images locally.

services:
  new-api:
    image: ${SDKMAX_IMAGE:-raymond1360/sdkmax-new-api:v1.0.1}
    container_name: sdkmax-new-api
    restart: always
    network_mode: host
    command: --log-dir /app/logs
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: ${PORT:-3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      SQL_DSN: ${SQL_DSN}
      LOG_SQL_DSN: ${LOG_SQL_DSN:-}
      REDIS_CONN_STRING: ${REDIS_CONN_STRING:-}
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      MEMORY_CACHE_ENABLED: ${MEMORY_CACHE_ENABLED:-true}
      NODE_NAME: ${NODE_NAME:-sdkmax-prod-1}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${PORT:-3000}/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
